[build-system]
requires = ["setuptools==83.0.0", "wheel==0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "metaplatform"
version = "0.1.0"
description = "MetaPlatform configurator, runtime and client"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "PySide6==6.11.2",
    "zstandard==0.25.0",
    "Pillow==12.3.0",
    "openpyxl==3.1.5",
    "pywin32==312; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pip-audit==2.10.1",
]

[project.scripts]
metaplatform-launcher = "src.scripts.run_launcher_qt:main"
metaplatform-configurator = "src.configurator.configurator_app:main"
metaplatform-client = "src.client.client_app:main"
metaplatform-runtime = "src.scripts.run_runtime_server_cmd:main"
metaplatform-runtime-admin = "src.runtime.admin_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
cache_dir = ".pytest_cache"
testpaths = ["src/tests"]


[tool.setuptools.package-data]
"src" = [
    "assets/*",
    "assets/icon/icons/*",
    "assets/icons/*",
    "assets/icons/png/*",
    "assets/icons/svg/*",
    "client/forms/styles/*",
    "docs/*",
    "ui_qt/assets/icons/*",
    "ui_qt/styles/dark/*",
    "ui_qt/styles/hybrid/*",
]
