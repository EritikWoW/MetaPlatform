name: CI

on:
  push:
    branches: ["master", "audit-remediation-*"]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows / Python 3.13
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: "offscreen"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "requirements.lock"

      - name: Install pinned direct dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps

      - name: Compile Python sources
        run: python -m compileall -q src

      - name: Reject tracked private data and obvious secrets
        run: python -m src.scripts.ci_private_data_check

      - name: Run test suite
        run: python -m pytest -q src/tests

      - name: Synthetic 1CD import contract smoke
        run: python -m src.scripts.import_contract_smoke

      - name: Runtime + Configurator + Client process smoke
        run: python -m src.scripts.runtime_process_smoke

      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.lock --progress-spinner off
