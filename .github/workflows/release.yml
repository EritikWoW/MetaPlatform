name: Release bundle

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: "offscreen"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "requirements.lock"

      - name: Install pinned dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps

      - name: Acceptance gates
        shell: pwsh
        run: |
          python -m compileall -q src
          python -m src.scripts.ci_private_data_check
          python -m pytest -q src/tests
          python -m src.scripts.import_contract_smoke
          python -m src.scripts.runtime_process_smoke
          python -m pip_audit -r requirements.lock --progress-spinner off

      - name: Build release artifacts
        run: python -m src.scripts.build_release --output dist

      - name: Upload release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: metaplatform-windows-${{ github.ref_name }}
          path: |
            dist/*.whl
            dist/*.zip
            dist/SHA256SUMS.json
          if-no-files-found: error
