<svg
  class="lucide lucide-database"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <defs>
    <!-- Gold gradients -->
    <linearGradient id="goldFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF2B3"/>
      <stop offset="0.45" stop-color="#F7C948"/>
      <stop offset="1" stop-color="#D08A00"/>
    </linearGradient>

    <linearGradient id="goldSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E3A400"/>
      <stop offset="0.5" stop-color="#FFDD73"/>
      <stop offset="1" stop-color="#C77900"/>
    </linearGradient>

    <linearGradient id="goldRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE89A"/>
      <stop offset="1" stop-color="#A86000"/>
    </linearGradient>
  </defs>

  <!-- Database (keeps currentColor) -->
  <ellipse cx="12" cy="5" rx="9" ry="3" />
  <path d="M3 5V19A9 3 0 0 0 21 19V5" />
  <path d="M3 12A9 3 0 0 0 21 12" />

  <!-- Coins overlay area (same slot as your 12.2x12.2 table) -->
  <!-- Slot top-left: (10.2, 10.3), size: 12.2 x 12.2 -->
  <g transform="translate(10.2 10.3)">
    <!-- Everything below is drawn inside 0..12.2 box -->
    <g stroke="#8A4B00" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round">
      <!-- back stack (2 coins) -->
      <g transform="translate(2.1 1.4)">
        <!-- bottom coin -->
        <path d="M2.2 3.6v2.6c0 .9 1.9 1.7 4.3 1.7s4.3-.8 4.3-1.7V3.6"
              fill="url(#goldSide)"/>
        <ellipse cx="6.5" cy="3.6" rx="4.3" ry="1.7" fill="url(#goldFace)"/>
        <ellipse cx="6.5" cy="3.6" rx="3.4" ry="1.3" fill="none" stroke="url(#goldRim)" stroke-width="0.55" opacity="0.9"/>
        <path d="M4.6 3.2c.7-.5 1.8-.9 2.8-1.0" stroke="#FFF6C9" stroke-width="0.55" opacity="0.9"/>
        <path d="M2.2 6.6v2.6c0 .9 1.9 1.7 4.3 1.7s4.3-.8 4.3-1.7V3.6"
              fill="url(#goldSide)"/>
	<clipPath id="half">
		<rect x="2.2" y="6.6" width="8.6" height="1.7"/>
	</clipPath>

	<ellipse cx="6.5" cy="6.3" rx="4.3" ry="1.7" fill="url(#goldFace)" clip-path="url(#half)" />


        <!-- top coin -->
        <g transform="translate(0 -2.0)">
          <path d="M2.2 3.6v2.2c0 .9 1.9 1.7 4.3 1.7s4.3-.8 4.3-1.7V3.6"
                fill="url(#goldSide)"/>
          <ellipse cx="6.5" cy="3.6" rx="4.3" ry="1.7" fill="url(#goldFace)"/>
          <ellipse cx="6.5" cy="3.6" rx="3.4" ry="1.3" fill="none" stroke="url(#goldRim)" stroke-width="0.55" opacity="0.9"/>
        </g>
      </g>

      <!-- front coin (slightly rotated), sized to match the same 12.2 slot -->
      <g transform="translate(1.1 7.3) rotate(-10 5.2 2.3)">
        <path d="M1.5 2.3v2.3c0 .8 1.7 1.4 3.7 1.4s3.7-.6 3.7-1.4V2.3"
              fill="url(#goldSide)"/>
        <ellipse cx="5.2" cy="2.3" rx="3.7" ry="1.4" fill="url(#goldFace)"/>
        <ellipse cx="5.2" cy="2.3" rx="2.9" ry="1.1" fill="none" stroke="url(#goldRim)" stroke-width="0.55" opacity="0.9"/>
        <path d="M3.8 1.9c.5-.4 1.3-.7 2.1-.8" stroke="#FFF6C9" stroke-width="0.55" opacity="0.9"/>
      </g>
    </g>
  </g>
</svg>
