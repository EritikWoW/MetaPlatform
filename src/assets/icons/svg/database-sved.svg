<svg
  class="lucide lucide-database"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <defs>
    <!-- Spreadsheet mini icon -->
    <linearGradient id="sheetHeader" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7EE08A"/>
      <stop offset="1" stop-color="#2FBF5A"/>
    </linearGradient>
    <linearGradient id="sheetPaper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9EEF6"/>
    </linearGradient>
  </defs>

  <!-- Database (keeps currentColor) -->
  <ellipse cx="12" cy="5" rx="9" ry="3" />
  <path d="M3 5V19A9 3 0 0 0 21 19V5" />
  <path d="M3 12A9 3 0 0 0 21 12" />

  <!-- Mini spreadsheet (bottom-right) -->
  <g transform="translate(10.2 10.3)">
    <!-- paper -->
    <rect x="0.0" y="0.3" width="12.2" height="12.2" rx="1.0"
          fill="url(#sheetPaper)" stroke="#2C3A4A" stroke-width="0.6" />
    <!-- header -->
    <rect x="0.0" y="0.3" width="12.2" height="1.8" rx="1.0"
          fill="url(#sheetHeader)" stroke="#1F7A3C" stroke-width="0.4" />
    <!-- grid lines -->
    <g stroke="#8FA2B8" stroke-width="0.35" opacity="0.95">
      <path d="M0.9 2.70H11.3" />
      <path d="M0.9 4.78H11.3" />
      <path d="M0.9 6.86H11.3" />
      <path d="M0.9 8.94H11.3" />
      <path d="M0.9 11.3H11.3" />

      <path d="M0.90 2.9V11.2" />		
      <path d="M2.98 2.9V11.2" />
      <path d="M5.06 2.9V11.2" />
      <path d="M7.14 2.9V11.2" />
      <path d="M9.22 2.9V11.2" />
      <path d="M11.3 2.9V11.2" />
    </g>
  </g>
</svg>
